name: CI-CD Deploy (DEV)

on:
  push:
    branches: ["dev"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build Project (skip tests)
        run: ./gradlew clean build -x test

      - name: Build Docker Image
        run: |
          docker build  -f Dockerfile_dev -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:dev .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:dev

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USER }}
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            echo "📦 최신 이미지 Pull"
            sudo docker compose pull

            echo "📦 기존 컨테이너 제거"
            docker compose down --rmi all --volumes
            
            echo "🚀 서비스 재시작"
            sudo docker compose up -d

            echo "🎉 도커 설치 완료!"

            echo "=== 🌐 PUBLIC IP 가져오기 ==="
            PUBLIC_IP=$(curl -s http://checkip.amazonaws.com)
            DOMAIN="${PUBLIC_IP}.nip.io"

             echo "=== 📦 Caddy 설치 ==="
            if ! command -v caddy &> /dev/null
            then
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key'  | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list
              sudo apt update
              sudo apt install -y caddy
            fi

            echo "=== 📝 Caddyfile 생성 (/etc/caddy/Caddyfile) ==="
            sudo bash -c "cat > /etc/caddy/Caddyfile" <<EOF
            ${DOMAIN} {
                reverse_proxy localhost:8080
            }
            EOF
            echo "=== 🔄 Caddy 서비스 시작 ==="
            sudo systemctl daemon-reload
            sudo systemctl enable --now caddy || true
            sudo systemctl restart caddy

            echo "=== ✅ Caddy 상태 ==="
            sudo systemctl status caddy --no-pager

            echo "=== 🎉 배포 완료 ==="


            
